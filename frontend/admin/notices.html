<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice Board Management - Hostel Management System</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon"><i class="fa-solid fa-hotel"></i></div>
        <div>
          <div class="sidebar-brand">Hostel<span>Sphere</span></div>
          <span class="sidebar-role-badge">Warden Admin</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Core Management</div>
        <a href="/admin/dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="/admin/students.html" class="nav-link"><i class="fa-solid fa-user-graduate"></i> Students</a>
        <a href="/admin/rooms.html" class="nav-link"><i class="fa-solid fa-bed"></i> Rooms & Beds</a>
        <a href="/admin/fees.html" class="nav-link"><i class="fa-solid fa-file-invoice-dollar"></i> Hostel Fees</a>

        <div class="nav-label">Operations & Desk</div>
        <a href="/admin/complaints.html" class="nav-link"><i class="fa-solid fa-bullhorn"></i> Complaints</a>
        <a href="/admin/visitors.html" class="nav-link"><i class="fa-solid fa-id-badge"></i> Visitor Logs</a>
        <a href="/admin/notices.html" class="nav-link active"><i class="fa-solid fa-clipboard-list"></i> Notice Board</a>
        <a href="/admin/reports.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Reports & Stats</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div id="sidebar-user-avatar" class="user-avatar">A</div>
          <div class="user-meta">
            <span id="sidebar-user-name" class="user-name">Chief Warden</span>
            <span id="sidebar-user-role" class="user-role-label">ADMINISTRATOR</span>
          </div>
        </div>
        <button class="btn-icon" title="Logout" onclick="logoutUser()" style="border-color:rgba(255,255,255,0.1); color:#ef4444;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="mobile-toggle-btn" onclick="toggleMobileSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1 class="page-title">Broadcast Notice Board</h1>
        </div>

        <div class="navbar-right">
          <button class="btn btn-primary btn-sm" onclick="openCreateNoticeModal()">
            <i class="fa-solid fa-bullhorn"></i> Post Notice
          </button>
        </div>
      </header>

      <div class="content-body">
        
        <!-- Filter Bar -->
        <div class="action-bar">
          <div class="search-filter-group">
            <div class="search-input-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="notice-search" class="form-control" placeholder="Search announcements..." oninput="loadNotices()">
            </div>

            <select id="filter-notice-category" class="form-select filter-select" onchange="loadNotices()">
              <option value="All">All Categories</option>
              <option value="General">General</option>
              <option value="Event">Event</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Rules">Hostel Rules</option>
              <option value="Mess">Mess / Dining</option>
              <option value="Urgent">Urgent Alert</option>
            </select>

            <select id="filter-notice-priority" class="form-select filter-select" onchange="loadNotices()">
              <option value="All">All Priorities</option>
              <option value="Urgent">Urgent</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <button class="btn btn-secondary btn-sm" onclick="loadNotices()">
            <i class="fa-solid fa-rotate"></i> Refresh
          </button>
        </div>

        <!-- Notices Cards Grid -->
        <div id="notices-list-container" class="notices-list">
          <div class="loading-container" style="grid-column: 1/-1;"><span class="spinner"></span></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create / Edit Notice Modal -->
  <div id="notice-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="notice-modal-title" class="modal-title">Broadcast Notice</h3>
        <button class="modal-close" onclick="closeModal('notice-modal')">&times;</button>
      </div>
      <form id="notice-form" onsubmit="handleSaveNotice(event)">
        <div class="modal-body">
          <input type="hidden" id="notice-id-field">

          <div class="form-group">
            <label class="form-label">Notice Title <span class="req">*</span></label>
            <input type="text" id="modal-notice-title" class="form-control" required placeholder="e.g. Scheduled Water Tank Cleaning">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="modal-notice-category" class="form-select">
                <option value="General">General</option>
                <option value="Event">Event</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Rules">Rules & Discipline</option>
                <option value="Mess">Mess & Dining</option>
                <option value="Urgent">Urgent Alert</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Priority Level</label>
              <select id="modal-notice-priority" class="form-select">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Expiry Date (Optional)</label>
            <input type="date" id="modal-notice-expiry" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Description / Announcement Body <span class="req">*</span></label>
            <textarea id="modal-notice-desc" class="form-control" style="min-height:120px;" required placeholder="Write detailed notice announcement here..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('notice-modal')">Cancel</button>
          <button type="submit" id="save-notice-btn" class="btn btn-primary">
            <i class="fa-solid fa-bullhorn"></i> Publish Notice
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notices.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth('admin');
      loadNotices();
    });
  </script>
</body>
</html>
